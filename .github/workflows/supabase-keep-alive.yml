name: Supabase keep-alive

# Free Supabase projects are paused after 7 days without activity.
# Runs a small database query every 2 days so the project stays awake.
# Required repository secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 */2 * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Row level security returns no rows to the anon key, but the query still reaches the database
      - run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/branches?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
